<head>
  <!-- Metadatos básicos -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{titulo}} | ALTURA Sports Academy</title>
  <meta name="description" content="{{descripcion}}">
  <meta name="keywords" content="{{palabras}}">
  <meta name="author" content="Quispe Morales, Fabricio Oscar - Grupo 04">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <!-- Open Graph: vista previa al compartir en redes -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ALTURA Sports Academy">
  <meta property="og:title" content="{{titulo}} | ALTURA Sports Academy">
  <meta property="og:description" content="{{descripcion}}">
  <meta property="og:image" content="{{R}}assets/img/hero/hero-basquet.webp">
  <meta property="og:locale" content="es_PE">
  <link rel="icon" href="{{R}}assets/img/logo/favicon.svg" type="image/svg+xml">

  <!-- Tipografías e íconos externos (Google Fonts + Material Symbols) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&amp;display=swap">

  <!-- Framework Material Design CSS (MDC Web 14) por enlace externo -->
  <link rel="stylesheet" href="https://unpkg.com/material-components-web@14.0.0/dist/material-components-web.min.css">

  <!-- Hojas de estilo propias, en orden de cascada -->
  <link rel="stylesheet" href="{{R}}assets/css/base.css">              <!-- g.i   CSS externo (10 %) -->
  <link rel="stylesheet" href="{{R}}assets/css/altura-less.css">       <!-- g.ii  LESS compilado (15 %) -->
  <link rel="stylesheet" href="{{R}}assets/css/altura-sass.css">       <!-- g.iii SASS compilado (15 %) -->
  <link rel="stylesheet" href="{{R}}assets/css/framework/layout.css">      <!-- j. Flexbox + Grid (20 %) -->
  <link rel="stylesheet" href="{{R}}assets/css/framework/responsive.css">  <!-- i. Media queries + multimedia (20 %) -->
  <link rel="stylesheet" href="{{R}}assets/css/framework/animaciones.css"> <!-- h. Animaciones (20 %) -->

  <!-- JavaScript: framework MDC + interacciones propias (diferidos) -->
  <script src="https://unpkg.com/material-components-web@14.0.0/dist/material-components-web.min.js" defer></script>
  <script src="{{R}}assets/js/main.js" defer></script>
</head>
